<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabelKit — Read Any Food Label in Plain Words</title>
<meta name="description" content="Type in the numbers from any food packet and get a plain-words verdict: traffic lights for sugar, salt and fat, a score out of 100, and what one serving really means.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf5ec; --paper2:#f3ead9; --card:#fffdf7; --ink:#2b1d12; --ink2:#6b5844; --ink3:#9a8871;
  --line:#e5d9c3; --bronze:#b07d3c; --bronze2:#8a5f27; --amber:#e8a33d; --terra:#c05b2e; --terra2:#a34a22;
  --green:#3f7a4e; --greenbg:#e3efe2; --amberbg:#fdf0d3; --red:#b3372a; --redbg:#fbe4de;
  --shadow:0 10px 30px rgba(43,29,18,.10); --shadow2:0 4px 14px rgba(43,29,18,.08);
  --r:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
img{max-width:100%;display:block}
a{color:var(--bronze2)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
::selection{background:var(--amber);color:var(--ink)}
/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#241708,#3a2410 55%,#5c3413);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fdf6e9;transition:opacity .6s,visibility .6s;text-align:center;padding:24px}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
#intro .lens{width:92px;height:92px;border-radius:50%;border:3px solid var(--amber);display:flex;align-items:center;justify-content:center;animation:lensIn 1s cubic-bezier(.2,.9,.3,1.2) both, floaty 3.4s ease-in-out 1s infinite}
#intro .lens svg{width:46px;height:46px}
@keyframes lensIn{from{transform:scale(.4) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
#intro h1{font-size:52px;font-weight:900;letter-spacing:.5px;margin-top:22px;animation:rise .8s .25s both}
#intro h1 em{color:var(--amber);font-style:normal}
#intro p{font-size:17px;opacity:.85;margin-top:8px;animation:rise .8s .45s both}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
#intro .bar{width:min(300px,80vw);height:5px;background:rgba(255,255,255,.22);border-radius:99px;margin-top:30px;overflow:hidden;animation:rise .8s .6s both}
#intro .bar i{display:block;height:100%;width:0;background:var(--amber);border-radius:99px;animation:fill 3.6s .3s ease forwards}
@keyframes fill{to{width:100%}}

#intro .skip{margin-top:26px;background:transparent;border:1px solid rgba(255,255,255,.5);color:#fdf6e9;border-radius:99px;padding:9px 22px;font-size:14px;font-weight:600;animation:rise .8s .7s both}
#intro .skip:hover{background:rgba(255,255,255,.12)}
/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:90;background:rgba(250,245,236,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:18px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:900;font-size:22px;color:var(--ink);text-decoration:none}
.logo .mk{width:36px;height:36px;border-radius:11px;background:linear-gradient(140deg,var(--bronze),var(--terra));display:flex;align-items:center;justify-content:center;flex:0 0 36px}
.logo .mk svg{width:20px;height:20px}
.logo em{color:var(--terra);font-style:normal}
header.top nav{display:flex;gap:4px;margin-left:auto}
header.top nav a{color:var(--ink2);text-decoration:none;font-size:14px;font-weight:600;padding:8px 11px;border-radius:99px}
header.top nav a:hover{background:var(--paper2);color:var(--ink)}
.todaypill{margin-left:6px;background:var(--ink);color:#fdf6e9;border:none;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap}
.todaypill b{color:var(--amber)}
/* ---------- hero ---------- */
.hero{position:relative;border-radius:0 0 28px 28px;overflow:hidden;margin:0 12px}
.hero .ph{position:relative;height:430px;overflow:hidden}
.hero .ph img{width:100%;height:100%;object-fit:cover;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translateX(0)}to{transform:scale(1.12) translateX(-1.5%)}}
.hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,18,6,.12) 0%,rgba(30,18,6,.55) 62%,rgba(30,18,6,.82) 100%)}
.hero .copy{position:absolute;left:0;right:0;bottom:0;padding:34px 30px 30px;color:#fdf6e9;max-width:1120px;margin:0 auto}
.hero .kicker{display:inline-block;background:var(--amber);color:var(--ink);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:99px}
.hero h1{font-size:clamp(34px,5.4vw,58px);line-height:1.04;font-weight:900;margin-top:14px;max-width:760px}
.hero h1 em{color:var(--amber);font-style:normal}
.hero p{font-size:17px;opacity:.94;max-width:640px;margin-top:10px}
.hero .ctaRow{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:99px;padding:12px 20px;font-size:15px;font-weight:700;text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.btn-amber{background:var(--amber);color:var(--ink);box-shadow:0 6px 18px rgba(232,163,61,.45)}
.btn-ghost{background:rgba(255,255,255,.14);color:#fdf6e9;border:1px solid rgba(255,255,255,.55)}
/* ---------- stats strip ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow2)}
.stat b{font-family:Fraunces,serif;font-size:30px;display:block;line-height:1}
.stat span{font-size:13px;color:var(--ink2);font-weight:600}

  .stat em{display:block;font-style:normal;font-size:12px;color:var(--terra);font-weight:700;margin-top:2px}
/* ---------- sections ---------- */
section{padding:38px 0 6px}
.secHead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.secHead h2{font-size:30px;font-weight:900;line-height:1.1}
.secHead .n{font-family:Fraunces,serif;font-size:15px;font-weight:900;color:var(--terra);border:2px solid var(--terra);border-radius:99px;padding:3px 12px;flex:0 0 auto}
.secHead p{color:var(--ink2);font-size:15px;max-width:640px;margin-top:6px}
.secHead .hint{margin-left:auto;font-size:13px;color:var(--ink3);font-weight:600}
/* ---------- decoder bench ---------- */
.bench{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px}
.panel h3{font-size:21px;font-weight:900}
.panel .sub{font-size:13.5px;color:var(--ink2);margin-top:3px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.fgrid .full{grid-column:1/-1}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.field label small{font-weight:500;color:var(--ink3)}
.field input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--bronze);box-shadow:0 0 0 3px rgba(176,125,60,.18)}
.field input.err{border-color:var(--red);background:#fff7f5}
.fnote{font-size:12.5px;color:var(--ink3);margin-top:10px}
.btnrow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn-ink{background:var(--ink);color:#fdf6e9}
.btn-line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--bronze)}
.btn-terra{background:var(--terra);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
/* verdict card */
.verdict{min-height:480px;display:flex;flex-direction:column}
.verdict .empty{margin:auto;text-align:center;color:var(--ink3);padding:30px 10px}
.verdict .empty svg{width:64px;height:64px;opacity:.5;margin-bottom:12px}
.verdict .empty p{font-size:15px;max-width:320px;margin:0 auto}
.scoreRow{display:flex;gap:18px;align-items:center;margin-top:16px}
.ring{position:relative;width:132px;height:132px;flex:0 0 132px}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .val b{font-family:Fraunces,serif;font-size:38px;line-height:1}
.ring .val span{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.stamp{display:inline-block;font-family:Fraunces,serif;font-weight:900;font-size:21px;padding:8px 16px;border-radius:12px;transform:rotate(-1.5deg);border:2.5px solid}
.stamp.green{color:var(--green);border-color:var(--green);background:var(--greenbg)}
.stamp.amber{color:#8a5f27;border-color:var(--amber);background:var(--amberbg)}
.stamp.terra{color:var(--terra);border-color:var(--terra);background:#fbeee6}
.stamp.red{color:var(--red);border-color:var(--red);background:var(--redbg)}

  .verdict .vname{font-family:Fraunces,serif;font-size:22px;font-weight:900;margin-top:10px}
.verdict .vwhy{font-size:14.5px;color:var(--ink2);margin-top:6px}
.vmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.vmeta span{background:var(--paper2);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700}
.vmeta span.warn{background:var(--redbg);border-color:#eec4bb;color:var(--red)}
/* traffic lights */
.lights{margin-top:18px;display:grid;gap:9px}
.light{display:grid;grid-template-columns:118px 1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.light .lname{font-weight:700;font-size:14px}
.light .lname small{display:block;font-weight:500;color:var(--ink3);font-size:12px}
.light .bar{height:9px;border-radius:99px;background:#eadfca;overflow:hidden}
.light .bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.light .dot{font-size:12.5px;font-weight:800;padding:5px 11px;border-radius:99px;white-space:nowrap}
.dot.green{background:var(--greenbg);color:var(--green)}
.dot.amber{background:var(--amberbg);color:#8a5f27}
.dot.red{background:var(--redbg);color:var(--red)}
.spoon{margin-top:14px;background:var(--paper2);border:1px dashed var(--bronze);border-radius:14px;padding:13px 15px;font-size:14px}
.spoon b{font-family:Fraunces,serif;font-size:16px}
.vbtns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

/* ---------- quick picks rail ---------- */
.rail{display:flex;gap:13px;overflow-x:auto;padding:6px 2px 16px;scroll-snap-type:x mandatory;margin-top:16px}
.rail::-webkit-scrollbar{height:8px}.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.pick{flex:0 0 218px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;box-shadow:var(--shadow2);transition:transform .15s,border-color .15s}
.pick:hover{transform:translateY(-3px);border-color:var(--bronze)}
.pick b{font-family:Fraunces,serif;font-size:16.5px;display:block;line-height:1.25}
.pick .cat{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--terra);margin-bottom:5px;display:block}
.pick .nums{font-size:12.5px;color:var(--ink2);margin-top:8px;line-height:1.6}
.pick .nums b{display:inline;font-family:Inter,sans-serif;font-size:12.5px}
.pick .go{margin-top:10px;font-size:13px;font-weight:700;color:var(--bronze2)}
/* ---------- compare ---------- */
.cmpGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.cmpCard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;position:relative;box-shadow:var(--shadow2)}
.cmpCard.winner{border:2px solid var(--green)}
.cmpCard .crown{position:absolute;top:-11px;right:14px;background:var(--green);color:#fff;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:99px}
.cmpCard h4{font-family:Fraunces,serif;font-size:18px;line-height:1.25}
.cmpCard .cscore{font-family:Fraunces,serif;font-size:34px;font-weight:900;margin-top:6px}
.cmpCard .cscore small{font-size:13px;color:var(--ink3);font-family:Inter,sans-serif;font-weight:600}
.cmpCard .cverdict{font-size:13px;font-weight:700;margin-top:2px}
